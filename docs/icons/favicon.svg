<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Outer Arabesque Rosette -->
  <g transform="translate(256, 256)">
    <!-- 8-pointed star base 1 -->
    <rect x="-140" y="-140" width="280" height="280" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.85" />
    <!-- 8-pointed star base 2 (rotated 45deg) -->
    <rect x="-140" y="-140" width="280" height="280" rx="12" transform="rotate(45)" fill="none" stroke="url(#goldGrad)" stroke-width="5" opacity="0.85" />
    
    <!-- Inner star fill -->
    <rect x="-115" y="-115" width="230" height="230" rx="8" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9" />
    <rect x="-115" y="-115" width="230" height="230" rx="8" transform="rotate(45)" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="2" opacity="0.9" />

    <!-- Center Medallion circle -->
    <circle r="90" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />
    <circle r="82" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />

    <!-- Crescent and Star Motif -->
    <path d="M 12 -42 A 46 46 0 1 0 12 42 A 36 36 0 1 1 12 -42 Z" fill="url(#goldGrad)" />
    <!-- Small star inside crescent opening -->
    <path d="M 28 -4 L 31 3 L 39 4 L 33 10 L 35 18 L 28 13 L 21 18 L 23 10 L 17 4 L 25 3 Z" fill="url(#goldGrad)" />
    
    <!-- Open Book / Quran Leaves Accent at base -->
    <path d="M -48 38 Q 0 46 0 54 Q 0 46 48 38 Q 30 52 0 58 Q -30 52 -48 38 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>
